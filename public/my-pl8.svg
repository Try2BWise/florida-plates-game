<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120" fill="none">
  <!-- Plate body -->
  <rect x="3" y="3" width="234" height="114" rx="8" fill="#F5F2EC" stroke="#3FA7E0" stroke-width="2.5"/>
  <!-- Inner border -->
  <rect x="12" y="12" width="216" height="96" rx="4" stroke="#3FA7E0" stroke-width="0.75" opacity="0.4"/>
  <!-- Bolt holes -->
  <circle cx="24" cy="60" r="4" fill="none" stroke="#6B7280" stroke-width="1"/>
  <circle cx="216" cy="60" r="4" fill="none" stroke="#6B7280" stroke-width="1"/>
  <!-- "EVERY PL8" header -->
  <text x="120" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#3FA7E0" letter-spacing="2">EVERY PL8</text>
  <!-- "MY PL8" main text -->
  <text x="120" y="72" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800" fill="#123157" letter-spacing="3">MY PL8</text>
  <!-- Bottom line -->
  <text x="120" y="100" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6B7280" letter-spacing="1">USER ADDED</text>
</svg>
